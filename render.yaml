services:
  - type: web
    name: waprep-tuition-portal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: tuition.settings_staging
      - key: DEBUG
        value: true
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: waprep-tuition-db
    plan: free