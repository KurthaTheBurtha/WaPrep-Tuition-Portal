{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-11 col-lg-10 col-xl-8">
            <div class="login-box mt-5">
                <h2 class="text-center mb-4">Reset Your Password</h2>
                
                {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="post" action="{% url 'forgot_password' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                        <div class="form-text">Enter the email associated with your account to receive a reset link.</div>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Send Reset Link</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <a href="{% url 'payer_login' %}" class="text-decoration-none">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .login-box {
        background: white;
        padding: 2.5rem 3rem;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
        width: 100%;
    }

    .form-control {
        padding: 0.75rem;
        border-radius: 5px;
    }

    .form-control:focus {
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .btn-primary {
        padding: 0.75rem;
        font-weight: 500;
    }

    .alert {
        border-radius: 5px;
        margin-bottom: 1rem;
    }

    .form-text {
        color: #6c757d;
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }

    .container {
        background-color: transparent;
        box-shadow: none;
    }
</style>
{% endblock %}
