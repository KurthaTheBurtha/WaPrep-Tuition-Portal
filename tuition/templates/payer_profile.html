{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <!-- Back Button -->
            <a href="{% url 'payer_dashboard' %}" class="btn btn-link mb-3">
                <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
            </a>

            <!-- Payer Profile Card -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div>
                            <h2 class="mb-0">{{ user.first_name }} {{ user.last_name }}</h2>
                            <small class="text-muted">Email: {{ user.email }}</small>
                        </div>
                        <div class="ms-auto">
                            <a href="{% url 'payer_dashboard' %}" class="btn btn-outline-secondary btn-sm me-2">
                                <i class="fas fa-users me-1"></i> My Students
                            </a>
                            <a href="{% url 'edit_payer_profile' %}" class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-edit me-1"></i> Request to Update Info
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
