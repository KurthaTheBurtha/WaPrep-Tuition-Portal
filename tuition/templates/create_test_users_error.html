{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">
                <i class="fas fa-exclamation-circle"></i> Error Creating Test Users
            </h4>
        </div>
        <div class="card-body">
            <div class="alert alert-danger">
                <i class="fas fa-times-circle"></i>
                <strong>Error:</strong> Failed to create test users.
            </div>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Error Details</h5>
                </div>
                <div class="card-body">
                    <p><strong>Error Message:</strong></p>
                    <pre class="bg-light p-3">{{ error }}</pre>
                </div>
            </div>

            <div class="mt-3">
                <a href="{% url 'create_test_user' %}" class="btn btn-primary">
                    <i class="fas fa-redo"></i> Try Again
                </a>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                    <i class="fas fa-home"></i> Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
