{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">Add Payment Method</h4>
        </div>
        <div class="card-body">
            <form id="payment-method-form" method="post" action="{% url 'add_payment_method' %}">
                {% csrf_token %}
                <div class="mb-3" id="nickname_group">
                    <label for="nickname" class="form-label">Nickname</label>
                    <input type="text" class="form-control" id="nickname" name="nickname" placeholder="e.g., My Checking or Visa Card">
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment Details</label>
                    <div id="payment-element" class="form-control"></div>
                </div>
                <input type="hidden" name="payment_method_id" id="payment_method_id">
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        Save Payment Method
                    </button>
                    <a href="{% url 'payer_dashboard' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const stripe = Stripe("{{ STRIPE_PUBLISHABLE_KEY|default:'' }}");
const options = {
    clientSecret: "{{ STRIPE_CLIENT_SECRET|default:'' }}"
};
let elements;

async function initialize() {
    elements = stripe.elements(options);
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');
}

initialize();

document.getElementById('payment-method-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    document.getElementById('submit-btn').disabled = true;
    const nickname = document.getElementById('nickname').value;
    const {setupIntent, error} = await stripe.confirmSetup({
        elements,
        confirmParams: {
            payment_method_data: {
                billing_details: { name: nickname }
            }
        },
        redirect: 'if_required'
    });
    if (error) {
        alert(error.message);
        document.getElementById('submit-btn').disabled = false;
        return;
    }
    document.getElementById('payment_method_id').value = setupIntent.payment_method;
    this.submit();
});
</script>
{% endblock %}
